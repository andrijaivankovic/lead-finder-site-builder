search:
  default_limit: 60
  google_max_per_search: 60
  google_page_size: 20

protection:
  monthly_call_limit: 900

scoring:
  no_website: 50
  poor_website: 30
  good_rating: 20
  many_reviews: 20
  some_reviews: 10
  has_phone: 10
  few_reviews: -30

thresholds:
  good_rating: 4.3
  many_reviews: 50
  some_reviews: 20
  few_reviews: 10

contact_search_template: "https://www.google.com/search?q=site%3Acompanywall.rs+{name}"

reference_photos:
  max_per_business: 5
  max_width: 1200
  palette_colors: 5

stock_photos:
  per_purpose: 4
  max_total: 20
  min_width: 1920
  purposes:
    - hero
    - gallery
    - background
    - team
    - interior
  skip_alt_keywords:
    - portrait
    - selfie
    - headshot
    - logo
    - billboard
    - signage
    - brand

asset_sorting:
  categories:
    - interior
    - food
    - team
    - logo
    - exterior
  logo_colors: 5

audit:
  enabled: true
  timeout_seconds: 12
  workers: 8
  slow_seconds: 5
  very_slow_seconds: 9
  stale_after_years: 3
  poor_website_below: 60
  penalties:
    unreachable: 100
    no_https: 15
    no_viewport: 30
    slow: 5
    very_slow: 10
    stale_year: 20
    no_title: 10
    no_description: 10
    dated_platform: 15
    template_platform: 5
  messages:
    unreachable: "The website does not open at all, so anyone who searches for you online finds nothing."
    no_https: "The site has no security certificate, so browsers put a 'Not secure' warning next to the address."
    no_viewport: "The site does not adapt to phones, and roughly 70% of people look you up on a phone."
    slow: "The site needs {seconds} seconds to load, and most visitors give up before that."
    very_slow: "The site needs {seconds} seconds to load, which is slow enough that most visitors never see it."
    stale_year: "Nothing on the site has changed since {year}, which makes the business look closed."
    no_title: "The page has no title, so Google shows a blank line or the bare address in search results."
    no_description: "The page has no description, so Google invents its own text for your search result."
    dated_platform: "The site still runs on {platform}, which is years behind and a security risk as much as a look."
    template_platform: "The site is a {platform} template, so it looks like thousands of others and cannot be tailored much."

